# Shared location configuration for both HTTP and HTTPS servers

# Block malicious user agents
if ($blocked_user_agent) {
    return 403;
}

# Connection limits
limit_conn addr 100;
limit_conn perserver 1000;

# API endpoints
location /api/ {
    # Check if maintenance mode
    if (-f /var/www/maintenance.flag) {
        return 503;
    }

    # Rate limiting
    limit_req zone=api burst=50 nodelay;
    limit_req_status 429;

    # Remove /api prefix when proxying
    rewrite ^/api/(.*) /$1 break;

    # Proxy configuration
    proxy_pass http://api_backend;
    proxy_http_version 1.1;

    # Headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Request-ID $request_id;

    # WebSocket support
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Timeouts
    proxy_connect_timeout 30s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Buffering
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;
    proxy_temp_file_write_size 8k;

    # Don't cache API responses by default
    proxy_cache_bypass 1;
    proxy_no_cache 1;
    add_header X-Cache-Status $upstream_cache_status;

    # CORS headers (if not handled by backend)
    add_header 'Access-Control-Allow-Origin' '$http_origin' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
    add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

    # Handle preflight requests
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Max-Age' 1728000;
        add_header 'Content-Type' 'text/plain; charset=utf-8';
        add_header 'Content-Length' 0;
        return 204;
    }
}

# Authentication endpoints with stricter rate limiting
location /api/auth/ {
    limit_req zone=auth burst=5 nodelay;
    limit_req_status 429;

    rewrite ^/api/(.*) /$1 break;
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Shorter timeout for auth endpoints
    proxy_connect_timeout 10s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
}

# Admin API endpoints with authentication check
location /api/admin/ {
    limit_req zone=api burst=20 nodelay;
    
    # Add additional security for admin endpoints
    # Can add IP whitelist here if needed
    # allow 192.168.1.0/24;
    # deny all;
    
    rewrite ^/api/(.*) /$1 break;
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Webhook endpoints (higher rate limit for Shopify webhooks)
location /api/webhook/ {
    limit_req zone=webhook burst=200 nodelay;
    
    rewrite ^/api/(.*) /$1 break;
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Shopify webhook verification headers
    proxy_set_header X-Shopify-Topic $http_x_shopify_topic;
    proxy_set_header X-Shopify-Hmac-Sha256 $http_x_shopify_hmac_sha256;
    proxy_set_header X-Shopify-Shop-Domain $http_x_shopify_shop_domain;
    proxy_set_header X-Shopify-API-Version $http_x_shopify_api_version;
    proxy_set_header X-Shopify-Webhook-Id $http_x_shopify_webhook_id;
    
    # Increase buffer size for webhook payloads
    proxy_buffer_size 8k;
    proxy_buffers 16 8k;
    proxy_busy_buffers_size 16k;
    
    # Don't buffer webhook requests
    proxy_request_buffering off;
}

# API documentation
location /api/docs {
    rewrite ^/api/(.*) /$1 break;
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}

location /api/redoc {
    rewrite ^/api/(.*) /$1 break;
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}

location /api/openapi.json {
    rewrite ^/api/(.*) /$1 break;
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}

# Health check endpoint
location /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "healthy\n";
}

# API health check
location /api/health {
    access_log off;
    rewrite ^/api/(.*) /$1 break;
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}

# Metrics endpoint (internal only)
location /metrics {
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
    
    access_log off;
    proxy_pass http://api_backend/metrics;
}

# Static files
location /static/ {
    alias /usr/share/nginx/html/static/;
    expires 30d;
    add_header Cache-Control "public, immutable";
    access_log off;
    
    # Security headers for static files
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    
    # Enable gzip_static if available
    gzip_static on;
    
    # Serve pre-compressed files if they exist
    location ~ \.(js|css|html)$ {
        gzip_static on;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    
    # Images
    location ~ \.(jpg|jpeg|gif|png|ico|svg|webp)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    
    # Fonts
    location ~ \.(woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
    }
}

# Frontend application (React/Vite)
location / {
    limit_req zone=general burst=100 nodelay;
    
    # Check if maintenance mode
    if (-f /var/www/maintenance.flag) {
        return 503;
    }
    
    proxy_pass http://frontend_backend;
    proxy_http_version 1.1;
    
    # Headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # WebSocket support for Vite HMR in development
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    
    # Timeouts
    proxy_connect_timeout 30s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    
    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://frontend_backend;
        proxy_cache static;
        proxy_cache_valid 200 302 60m;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Cache-Status $upstream_cache_status;
    }
}

# Admin panel (if separate from main frontend)
location /admin {
    limit_req zone=general burst=50 nodelay;
    
    # Can add IP restrictions here
    # allow 192.168.1.0/24;
    # deny all;
    
    proxy_pass http://frontend_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# WebSocket endpoint for real-time updates
location /ws {
    proxy_pass http://api_backend/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    
    # WebSocket timeouts
    proxy_connect_timeout 7d;
    proxy_send_timeout 7d;
    proxy_read_timeout 7d;
}

# Block access to sensitive files
location ~ /\.(?!well-known) {
    deny all;
    access_log off;
    log_not_found off;
}

location ~ ^/(\.env|docker-compose|Dockerfile|\.git|\.github) {
    deny all;
    return 404;
}

# Security.txt
location /.well-known/security.txt {
    alias /var/www/security.txt;
}

# Robots.txt
location /robots.txt {
    alias /var/www/robots.txt;
    access_log off;
}

# Favicon
location /favicon.ico {
    alias /usr/share/nginx/html/favicon.ico;
    access_log off;
    expires 30d;
}

# Custom error pages
error_page 404 /404.html;
error_page 500 502 504 /50x.html;
error_page 503 /maintenance.html;

location = /404.html {
    root /usr/share/nginx/html/errors;
    internal;
}

location = /50x.html {
    root /usr/share/nginx/html/errors;
    internal;
}

location = /maintenance.html {
    root /usr/share/nginx/html/errors;
    internal;
}